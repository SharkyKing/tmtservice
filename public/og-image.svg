<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a2540"/>
      <stop offset="1" stop-color="#061a30"/>
    </linearGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7cb8de"/>
      <stop offset="0.5" stop-color="#3a7ca8"/>
      <stop offset="1" stop-color="#1e4d75"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.15" r="0.6">
      <stop offset="0" stop-color="#3a7ca8" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#3a7ca8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Grid pattern -->
  <g stroke="rgba(255,255,255,0.04)" stroke-width="1">
    <line x1="0" y1="0" x2="0" y2="630"/>
    <line x1="100" y1="0" x2="100" y2="630"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="500" y1="0" x2="500" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="700" y1="0" x2="700" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
    <line x1="1100" y1="0" x2="1100" y2="630"/>
  </g>

  <!-- TMT badge hexagon -->
  <g transform="translate(800, 180)">
    <path d="M70,8 L210,8 L272,120 L210,232 L70,232 L8,120 Z" fill="url(#badge)" stroke="rgba(255,255,255,0.4)" stroke-width="4"/>
    <line x1="28" y1="120" x2="252" y2="120" stroke="white" stroke-width="6"/>
    <!-- Tamsus kontūras po uzpildu: be jo balta juosta eina per raides -->
    <text x="140" y="160" font-size="88" font-family="Impact,Arial Black,sans-serif"
          font-weight="900" fill="white" text-anchor="middle" font-style="italic"
          stroke="#0d2b45" stroke-width="14" stroke-linejoin="round"
          style="paint-order:stroke fill">TMT</text>
  </g>

  <!-- Main text -->
  <text x="80" y="240" font-size="68" font-family="Inter,Arial,sans-serif" font-weight="900" fill="white" letter-spacing="-2">Vokiškų automobilių</text>
  <text x="80" y="320" font-size="68" font-family="Inter,Arial,sans-serif" font-weight="900" fill="#5ba3d0" letter-spacing="-2">remontas Kaune</text>

  <!-- Subtitle -->
  <text x="80" y="395" font-size="28" font-family="Inter,Arial,sans-serif" font-weight="500" fill="rgba(255,255,255,0.7)">DSG • Multitronic • Mercedes CVT</text>
  <text x="80" y="430" font-size="28" font-family="Inter,Arial,sans-serif" font-weight="500" fill="rgba(255,255,255,0.7)">valdymo blokų remontas</text>

  <!-- Stats / badges -->
  <g transform="translate(80, 490)">
    <rect x="0" y="0" width="220" height="80" rx="12" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)"/>
    <text x="20" y="36" font-size="38" font-family="Inter,Arial,sans-serif" font-weight="900" fill="#5ba3d0">20+</text>
    <text x="20" y="62" font-size="14" font-family="Inter,Arial,sans-serif" font-weight="600" fill="rgba(255,255,255,0.6)" letter-spacing="1">METŲ PATIRTIS</text>

    <rect x="240" y="0" width="220" height="80" rx="12" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)"/>
    <text x="260" y="36" font-size="38" font-family="Inter,Arial,sans-serif" font-weight="900" fill="#5ba3d0">12 mėn.</text>
    <text x="260" y="62" font-size="14" font-family="Inter,Arial,sans-serif" font-weight="600" fill="rgba(255,255,255,0.6)" letter-spacing="1">GARANTIJA</text>

    <rect x="480" y="0" width="220" height="80" rx="12" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)"/>
    <text x="500" y="36" font-size="32" font-family="Inter,Arial,sans-serif" font-weight="900" fill="#5ba3d0">+370 37 563 222</text>
    <text x="500" y="62" font-size="14" font-family="Inter,Arial,sans-serif" font-weight="600" fill="rgba(255,255,255,0.6)" letter-spacing="1">SKAMBINKITE</text>
  </g>

  <!-- Brand line -->
  <text x="80" y="80" font-size="18" font-family="Inter,Arial,sans-serif" font-weight="600" fill="rgba(255,255,255,0.5)" letter-spacing="3">UAB TMT · AUTOSERVISAS KAUNE</text>
</svg>
